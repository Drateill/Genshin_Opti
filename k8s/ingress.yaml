# Traefik ingress (K3s default), same pattern as the other apps on this
# cluster (e.g. darkheresy-ingress): plain HTTP on the "web" entrypoint.
# TLS/public exposure is handled externally by Nginx Proxy Manager, which
# reverse-proxies genshin.drateil.ovh to the cluster's Traefik LoadBalancer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genshin-optimizer
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: genshin.drateil.ovh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
