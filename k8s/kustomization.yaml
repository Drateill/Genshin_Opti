apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: genshin-optimizer
resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
# Bumped by .github/workflows/deploy.yml after each successful image build —
# this is the file ArgoCD picks up the new tag from.
images:
  - name: ghcr.io/drateill/genshin_opti-backend
    newTag: 4819d6b
  - name: ghcr.io/drateill/genshin_opti-frontend
    newTag: 4819d6b
