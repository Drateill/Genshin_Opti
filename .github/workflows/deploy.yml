name: Build, Deploy & Verify

on:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/genshin_opti-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/genshin_opti-frontend

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: "Discord: build started"
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"🔨 Build started for \`${{ github.repository }}\` @ \`${{ steps.vars.outputs.sha }}\` (${{ github.actor }})\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: "Discord: images pushed"
        if: success()
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"📦 Images pushed to GHCR: backend & frontend @ \`${{ steps.vars.outputs.sha }}\`\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

      - name: "Discord: build failed"
        if: failure()
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ Build/push failed for \`${{ github.repository }}\` @ \`${{ steps.vars.outputs.sha }}\` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump image tags in k8s/kustomization.yaml
        run: |
          yq -i '(.images[] | select(.name == "${{ env.BACKEND_IMAGE }}").newTag) = "${{ needs.build-and-push.outputs.sha }}"' k8s/kustomization.yaml
          yq -i '(.images[] | select(.name == "${{ env.FRONTEND_IMAGE }}").newTag) = "${{ needs.build-and-push.outputs.sha }}"' k8s/kustomization.yaml

      - name: Commit & push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet || git commit -m "deploy: bump images to ${{ needs.build-and-push.outputs.sha }} [skip ci]"
          git push

      - name: "Discord: deploy triggered"
        if: success()
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"🚀 Manifests updated to \`${{ needs.build-and-push.outputs.sha }}\` — ArgoCD will sync shortly\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

      - name: "Discord: manifest update failed"
        if: failure()
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ Failed to update k8s manifests — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

  verify-deploy:
    needs: update-manifests
    runs-on: ubuntu-latest
    steps:
      - name: "Discord: waiting for ArgoCD sync"
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"⏳ Waiting for ArgoCD to sync and the app to become healthy...\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

      - name: Poll health endpoint
        env:
          HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "APP_HEALTH_URL repo variable is not set (Settings > Secrets and variables > Actions > Variables). See DEPLOYMENT.md."
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -sf "$HEALTH_URL/healthz" > /dev/null; then
              echo "App is healthy after $i attempt(s)"
              exit 0
            fi
            echo "Not ready yet (attempt $i/30), sleeping 10s..."
            sleep 10
          done
          echo "Timed out waiting for app to become healthy"
          exit 1

      - name: Smoke test API
        env:
          HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
        run: curl -sf "$HEALTH_URL/api/characters" > /dev/null

      - name: "Discord: deploy verified"
        if: success()
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ Deployment verified — app healthy at \`${{ vars.APP_HEALTH_URL }}\`\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

      - name: "Discord: verification failed"
        if: failure()
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ Deployment verification failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
